<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog – Venkatesh Komera</title>
<meta name="description" content="Articles on UX, UI design and accessibility by Venkatesh Komera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fc;--s:#fff;--s2:#eaeefb;--ink:#14183a;--mute:#555b82;--line:#d6dbee;--acc:#3d5afe;--hi:#ffd23f;--pk:#ff4f9f;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
a{color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(243,245,252,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo{font:800 19px "Bricolage Grotesque";text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--hi)}
.links{display:flex;align-items:center;gap:6px}
.links a{text-decoration:none;font-weight:500;color:var(--mute);padding:8px 14px;border-radius:999px}
.links a.on{background:var(--ink);color:#fff}
.btn{display:inline-block;background:var(--hi);color:#14183a!important;padding:10px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--hi);cursor:pointer;font-family:inherit;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)!important;border-color:var(--line)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff!important}
.hero{padding:64px 0 34px}
.hero small{color:var(--acc);font:700 14px "DM Sans";letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,6vw,72px);margin:10px 0 12px}
.hero p{color:var(--mute);max-width:56ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;padding:20px 0 70px}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--s);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:0 22px 44px rgba(30,40,110,.14)}
.card .im{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#6d28d9,#ec4899)}
.card .im img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .7s}
.card:hover .im img{transform:scale(1.06)}
.card .bd{padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font:700 12px "DM Sans";padding:4px 11px;border-radius:99px;background:rgba(61,90,254,.1);color:var(--acc)}
.card h2{font-size:23px}
.card p{margin:0;color:var(--mute);font-size:16px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:6px;color:var(--mute);font-size:14px;display:flex;justify-content:space-between}
.meta b{color:var(--acc)}
.empty{padding:40px;border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--mute);margin:20px 0 70px}
/* post */
.post{max-width:760px;margin:0 auto;padding:44px 24px 60px}
.back{display:inline-flex;gap:8px;text-decoration:none;font-weight:700;color:var(--acc);margin-bottom:26px}
.post h1{font-size:clamp(34px,5.4vw,58px);margin:14px 0 16px}
.pm{color:var(--mute);font-size:15px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:30px}
.body p{margin:0 0 22px;font-size:19px;line-height:1.75}
.body h2{font-size:30px;margin:38px 0 14px}
.body ul{margin:0 0 26px;padding:0;list-style:none;display:grid;gap:10px}
.body li{position:relative;padding:14px 18px 14px 50px;background:var(--s);border:1px solid var(--line);border-radius:14px;font-size:18px}
.body li::before{content:"✓";position:absolute;left:16px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.body figure{margin:30px -60px 34px;background:var(--s);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 20px 50px rgba(30,40,110,.12)}
.body figure img{width:100%;border-radius:14px}
.body figcaption{font-size:14px;color:var(--mute);text-align:center;padding:10px 6px 2px}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:40px 0 0;padding-top:26px;border-top:1px solid var(--line);align-items:center}
.more{max-width:1080px;margin:0 auto;padding:0 24px 70px}
.more h3{font-size:28px;margin-bottom:6px}
/* composer */
.wr{max-width:1080px;margin:0 auto;padding:40px 24px 70px;display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.wr h1{font-size:44px;grid-column:1/-1}.wr .hint{grid-column:1/-1;color:var(--mute);margin:-14px 0 0}
.fm{display:grid;gap:14px}
.fm label{font-weight:700;font-size:14px;display:grid;gap:6px}
.fm input,.fm textarea{font:400 16px "DM Sans";color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
.fm textarea{min-height:260px;resize:vertical;line-height:1.6}
.fm .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm small{font-weight:400;color:var(--mute)}
.pv{background:var(--s);border:1px solid var(--line);border-radius:20px;padding:24px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
.pv .body figure{margin:20px 0}
.pv .body p,.pv .body li{font-size:16px}.pv h1{font-size:30px;margin:0 0 14px}
.out{background:#14183a;color:#dbe0ff;border-radius:14px;padding:14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:200px;overflow:auto;word-break:break-all}
.steps{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px 20px;font-size:15px;color:var(--mute)}
.steps ol{margin:6px 0 0;padding-left:20px}
footer{text-align:center;color:var(--mute);font-size:14px;padding:0 0 40px}
@media (max-width:860px){.wr{grid-template-columns:1fr}.pv{position:static;max-height:none}.body figure{margin-left:0;margin-right:0}}
@media (max-width:560px){.links a:not(.btn){display:none}.links a.on{display:block}.hero{padding-top:40px}.body p{font-size:18px}}
</style>
</head>
